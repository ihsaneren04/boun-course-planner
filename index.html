<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ders Programı Planlayıcı</title>
<style>
  :root{
    --paper:#F7F1E6; --surface:#FFFCF6; --ink:#2E2620; --muted:#8A7A69;
    --line:#E4D9C8; --line-strong:#CDBCA5;
    --accent:#B15A2B; --accent-soft:#F6E5D6;
    --alarm:#A63A2C; --alarm-soft:#F8E3DD;
    --sat:52%; --bl:88%; --fl:30%;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  html[data-theme="dark"]{
    --paper:#1E1A17; --surface:#272220; --ink:#F0E6D9; --muted:#A2907C;
    --line:#3A322C; --line-strong:#4C4139;
    --accent:#E09A5C; --accent-soft:#3A2C21;
    --alarm:#E08070; --alarm-soft:#3D2622;
    --sat:34%; --bl:26%; --fl:82%;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}

  header{display:flex;align-items:center;gap:12px;padding:16px 20px 12px;max-width:1280px;margin:0 auto;flex-wrap:wrap}
  header h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  header .term{font-family:var(--mono);font-size:11px;color:var(--muted)}
  header .sp{flex:1}
  .ghost{border:1px solid var(--line-strong);border-radius:100px;padding:5px 13px;font-size:12.5px;color:var(--muted)}
  .ghost:hover{border-color:var(--accent);color:var(--accent)}
  .icon-btn{border:1px solid var(--line-strong);border-radius:100px;width:32px;height:32px;flex:none;display:grid;place-items:center;color:var(--muted)}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent)}
  .theme-icon{width:17px;height:17px;display:none}
  html[data-theme="light"] #iconSun{display:block}
  html[data-theme="dark"] #iconMoon{display:block}

  main{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:18px;padding:4px 20px 40px;max-width:1280px;margin:0 auto;align-items:start}
  @media (max-width:920px){main{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}

  .search{padding:12px}
  .search input{width:100%;padding:9px 12px;border:1px solid var(--line-strong);border-radius:8px;font:inherit;font-size:13px;background:var(--paper);color:var(--ink)}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{outline:none;border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
  .chip{font-family:var(--mono);font-size:11px;padding:4px 10px;border:1px solid var(--line-strong);border-radius:100px;color:var(--muted)}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
  .list{max-height:min(70vh,820px);overflow:auto;border-top:1px solid var(--line)}

  .row{display:flex;gap:10px;align-items:center;padding:9px 12px 9px 9px;border-bottom:1px solid var(--line);border-left:3px solid transparent;min-height:56px;box-sizing:border-box}
  .row.clashrow{border-left-color:var(--alarm)}
  .row:last-child{border-bottom:none}
  .row.sub{padding-left:23px;background:color-mix(in srgb,var(--paper) 55%,transparent)}
  .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
  .l1{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
  .l1 .code{font-family:var(--mono);font-size:12px;flex:none}
  .l1 .when{flex:none}
  .l1 .pill{flex:none;margin-left:auto}
  .l2{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .when{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:400}
  .pill{font-family:var(--mono);font-size:10px;border:1px solid var(--line-strong);border-radius:100px;padding:1px 7px;color:var(--muted)}
  .pill:hover{border-color:var(--accent);color:var(--accent)}
  .ctype{font-family:var(--mono);font-size:10px;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 6px;flex:none}
  .add{border:1px solid var(--accent);color:var(--accent);border-radius:100px;width:26px;height:26px;flex:none;font-size:16px;line-height:1;display:grid;place-items:center}
  .add:hover{background:var(--accent-soft)}
  .add[data-on="1"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

  .stats{display:flex;gap:26px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .stat b{display:block;font-family:var(--mono);font-size:20px;font-weight:600;line-height:1.15}
  .stat span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .stat.hot b{color:var(--alarm)}

  .gridwrap{padding:14px;overflow-x:auto}
  table.grid{border-collapse:collapse;width:100%;table-layout:fixed;min-width:620px}
  table.grid th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:0 0 8px}
  table.grid th.h{width:52px}
  td.h{width:52px;text-align:right;padding:3px 9px 0 0;font-family:var(--mono);font-size:10px;color:var(--muted);vertical-align:top}
  td.s{height:44px;padding:2px;vertical-align:top;border-top:1px solid var(--line)}
  .blk{border-radius:6px;padding:4px 6px;height:100%;overflow:hidden}
  .blk .c{font-family:var(--mono);font-size:10.5px;font-weight:700;display:block;line-height:1.2}
  .blk .r{font-size:9px;opacity:.75;display:block;font-family:var(--mono);white-space:nowrap;overflow:hidden}
  .blk.comp{opacity:.86;border:1px dashed currentColor}
  .clash{display:flex;flex-direction:column;gap:2px;height:100%;outline:1.5px solid var(--alarm);border-radius:6px;padding:1px}
  .clash .blk{padding:1px 5px;flex:1}
  .clash .blk .c{font-size:9.5px}

  .note{margin:0 18px 14px;padding:10px 12px;border-radius:8px;font-size:12.5px;background:var(--alarm-soft);color:var(--alarm)}
  .note ul{margin:5px 0 0;padding-left:18px}
  .note.soft{background:var(--accent-soft);color:var(--accent)}
  .sel{border-top:1px solid var(--line)}
  .swatch{width:8px;align-self:stretch;min-height:26px;border-radius:4px;flex:none}
  .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .opt{font-family:var(--mono);font-size:11px;padding:3px 9px;border:1px solid var(--line-strong);border-radius:100px}
  .opt:hover{border-color:var(--accent)}
  .opt[data-on="1"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
  .opt[data-clash="1"]{border-color:var(--alarm);color:var(--alarm)}
  .opt[data-on="1"][data-clash="1"]{background:var(--alarm);border-color:var(--alarm);color:var(--surface)}
  .x{color:var(--muted);font-size:17px;padding:2px 6px;border-radius:6px}
  .x:hover{background:var(--alarm-soft);color:var(--alarm)}
  .msg{padding:18px;color:var(--muted);font-size:13px}
  .msg code{font-family:var(--mono);font-size:12px;color:var(--ink)}
</style>

<header>
  <h1>Ders Programı Planlayıcı</h1>
  <span class="term" id="term"></span>
  <span class="sp"></span>
  <button class="icon-btn" id="btnTheme" title="Temayı değiştir" aria-label="Temayı değiştir">
    <svg id="iconSun" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"></circle><line x1="12" y1="1.5" x2="12" y2="4.2"></line><line x1="12" y1="19.8" x2="12" y2="22.5"></line><line x1="4.4" y1="4.4" x2="6.3" y2="6.3"></line><line x1="17.7" y1="17.7" x2="19.6" y2="19.6"></line><line x1="1.5" y1="12" x2="4.2" y2="12"></line><line x1="19.8" y1="12" x2="22.5" y2="12"></line><line x1="4.4" y1="19.6" x2="6.3" y2="17.7"></line><line x1="17.7" y1="6.3" x2="19.6" y2="4.4"></line></svg>
    <svg id="iconMoon" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.7 8.7 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7Z"></path></svg>
  </button>
  <button class="ghost" id="btnClear">Temizle</button>
</header>

<main>
  <section class="card">
    <div class="search"><input id="q" placeholder="kod, ad veya hoca ara…" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
    <div class="list" id="list"><div class="msg">Katalog yükleniyor…</div></div>
  </section>

  <section class="card">
    <div class="stats">
      <div class="stat"><b id="sCr">0</b><span>Kredi</span></div>
      <div class="stat"><b id="sEc">0</b><span>ECTS</span></div>
      <div class="stat"><b id="sN">0</b><span>Ders</span></div>
      <div class="stat" id="sClashWrap"><b id="sCl">0</b><span>Çakışma</span></div>
    </div>
    <div class="gridwrap" id="grid"></div>
    <div id="notes"></div>
    <div class="sel" id="sel"></div>
  </section>
</main>

/* ---------- ayrıştırma ---------- */
function cells(src){
  return src.split(/\r?\n/)
    .map(l=>(l.includes("\t")?l.split("\t"):l.split(/ {2,}/)))
    .map(r=>r.map(c=>c.replace(/\u00a0/g," ").replace(/\s+/g," ").trim()))
    .filter(r=>r.join("").length);
}
function headerMap(row){
  const m={};
  row.forEach((raw,i)=>{
    const h=raw.toLowerCase().trim(); if(!h) return;
    if(/ects/.test(h)) m.ects=i;
    else if(/^cr\b|^cr\.|credit|kredi/.test(h)) m.cr=i;
    else if(/^day/.test(h)) m.days=i;
    else if(/^hour|saat/.test(h)) m.hours=i;
    else if(/^room|derslik/.test(h)) m.rooms=i;
    else if(/^instr|lecturer|öğretim/.test(h)) m.instr=i;
    else if(/^name|course name|ad[ıi]/.test(h)) m.name=i;
    else if(/^sec\b|^sec\.|şube/.test(h)) m.sec=i;
    else if(/code|kod/.test(h)&&m.code===undefined) m.code=i;
  });
  return m;
}
function parseDays(s){
  const out=[], t=(s||"").replace(/[^A-Za-z]/g,"");
  for(let i=0;i<t.length;i++){
    const c=t[i].toUpperCase(), n=(t[i+1]||"").toLowerCase();
    if(c==="T"&&n==="h"){out.push(3);i++;}
    else if(c==="S"&&n==="a"){out.push(5);i++;}
    else if(c==="M")out.push(0); else if(c==="T")out.push(1);
    else if(c==="W")out.push(2); else if(c==="R")out.push(3);
    else if(c==="F")out.push(4); else if(c==="S")out.push(5);
  }
  return out;
}
function digitsToPeriods(str,n){
  const fail=new Set();
  const go=(s,k)=>{
    if(k===0) return s.length?null:[];
    if(!s.length) return null;
    const id=s.length+":"+k; if(fail.has(id)) return null;
    const one=Number(s[0]);
    if(one>=1){ const r=go(s.slice(1),k-1); if(r) return [one,...r]; }
    if(s.length>=2){ const two=Number(s.slice(0,2));
      if(two>=10&&two<=14){ const r=go(s.slice(2),k-1); if(r) return [two,...r]; } }
    fail.add(id); return null;
  };
  return go(str,n);
}
function parseHours(s,dayCount){
  const t=(s||"").match(/\d+/g)||[];
  if(!t.length) return [];
  if(t.length>1) return t.map(Number).filter(v=>v>=1&&v<=14);
  if(dayCount>0){ const r=digitsToPeriods(t[0],dayCount); if(r) return r; }
  const v=Number(t[0]); if(v>=1&&v<=14) return [v];
  return t[0].split("").map(Number).filter(v=>v>=1&&v<=14);
}
function parseRooms(s,n){
  const r=(s||"").split(/\s*[|;]\s*/).map(x=>x.trim()).filter(Boolean);
  if(r.length===n) return r;
  if(!r.length) return new Array(n).fill("");
  return Array.from({length:n},(_,i)=>r[i]||r[r.length-1]);
}
function buildSlots(d,h,rm){
  const days=parseDays(d), hours=parseHours(h,parseDays(d).length);
  if(!days.length||!hours.length) return [];
  const n=(days.length===1&&hours.length>1)?hours.length:Math.max(days.length,hours.length);
  const rooms=parseRooms(rm,n);
  return Array.from({length:n},(_,i)=>({d:days[days.length===1?0:i%days.length],h:hours[i%hours.length],room:rooms[i]||""}));
}
function splitCode(raw){
  const s=(raw||"").trim().replace(/\s+/g," ");
  const dot=s.lastIndexOf(".");
  if(dot>0&&/^\d{1,2}$/.test(s.slice(dot+1))) return {code:s.slice(0,dot).toUpperCase(),sec:s.slice(dot+1).padStart(2,"0")};
  return {code:s.toUpperCase(),sec:"01"};
}
function compType(n){
  const t=(n||"").toUpperCase().replace(/[^A-Z]/g,"");
  if(!t) return null;
  if(t.startsWith("LAB")) return "LAB";
  if(t.startsWith("PS")||t.startsWith("PROBLEM")||t.startsWith("REC")) return "P.S.";
  return t.slice(0,6);
}
function parseCatalog(src){
  const rows=cells(src);
  let hi=-1,map=null;
  for(let i=0;i<rows.length;i++){
    const j=rows[i].join("|").toLowerCase();
    if(/code|kod/.test(j)&&/day/.test(j)){
      const m=headerMap(rows[i]);
      if(m.code!==undefined&&m.days!==undefined){hi=i;map=m;break;}
    }
  }
  if(hi<0) return [];
  const out=[]; let last=null;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i], g=k=>(map[k]!==undefined?(r[map[k]]||""):"").trim();
    const codeRaw=g("code");
    if(/^code|^kod/i.test(codeRaw)) continue;
    const days=g("days"), hours=g("hours"), rooms=g("rooms"), name=g("name");
    if(!codeRaw){
      if(!last) continue;
      const slots=buildSlots(days,hours,rooms); if(!slots.length) continue;
      const type=compType(name);
      if(!type){ last.slots.push(...slots); continue; }
      const sig=type+"|"+slots.map(s=>s.d+"-"+s.h+"-"+s.room).join(",");
      if(last.comps.some(c=>c.sig===sig)) continue;
      const no=last.comps.filter(c=>c.type===type).length+1;
      last.comps.push({key:last.key+"#"+type+no,type,no,instr:g("instr"),slots,sig});
      continue;
    }
    if(!/[A-Za-z]/.test(codeRaw)||!/\d/.test(codeRaw)) continue;
    const pc=splitCode(codeRaw), secCell=g("sec");
    const sec=/^\d{1,2}$/.test(secCell)?secCell.padStart(2,"0"):pc.sec;
    last={key:pc.code+"."+sec,code:pc.code,sec,name,instr:g("instr"),
      cr:parseFloat((g("cr")||"").replace(",","."))||0,
      ects:parseFloat((g("ects")||"").replace(",","."))||0,
      dept:(pc.code.match(/^[A-Z]+/)||["?"])[0],
      slots:buildSlots(days,hours,rooms),comps:[]};
    out.push(last);
  }
  return out;
}

const byKey=k=>catalog.find(c=>c.key===k);
const compsOf=(c,t)=>c.comps.filter(x=>x.type===t);
const typesOf=c=>[...new Set(c.comps.map(x=>x.type))];
const pickedComps=c=>(picks[c.key]||[]).map(k=>c.comps.find(x=>x.key===k)).filter(Boolean);
function activeKeys(){
  const out=[...selected];
  Object.keys(picks).forEach(k=>{ if((picks[k]||[]).length&&!out.includes(k)) out.push(k); });
  return out.filter(byKey);
}
function assignColor(k){
  if(colorIds[k]!==undefined) return;
  const used=new Set(Object.values(colorIds));
  let i=0; while(used.has(i)) i++;
  colorIds[k]=i;
}
function syncColors(){
  const live=new Set(activeKeys());
  Object.keys(colorIds).forEach(k=>{ if(!live.has(k)) delete colorIds[k]; });
  live.forEach(assignColor);
}
function colorOf(k){
  const i=colorIds[k]??0, hue=Math.round((i*137.508+28)%360);
  const st=getComputedStyle(document.documentElement);
  const sat=st.getPropertyValue("--sat").trim()||"52%";
  const bl=st.getPropertyValue("--bl").trim()||"88%";
  const fl=st.getPropertyValue("--fl").trim()||"30%";
  return {bg:`hsl(${hue} ${sat} ${bl})`, fg:`hsl(${hue} ${sat} ${fl})`};
}
function unitsOf(key){
  const c=byKey(key); if(!c) return [];
  const u=selected.includes(key)?[{label:c.code+"."+c.sec,tag:"",slots:c.slots,courseKey:key}]:[];
  pickedComps(c).forEach(p=>u.push({label:c.code+"."+c.sec,tag:p.type+(compsOf(c,p.type).length>1?" "+p.no:""),slots:p.slots,courseKey:key,comp:true}));
  return u;
}
function occupancy(keys){
  const m=new Map();
  keys.forEach(k=>unitsOf(k).forEach(u=>u.slots.forEach(s=>{
    const id=s.d+":"+s.h; if(!m.has(id)) m.set(id,[]); m.get(id).push({unit:u,room:s.room});
  })));
  return m;
}
function clashesWith(slots,excludeKey){
  const occ=occupancy(activeKeys().filter(k=>k!==excludeKey));
  return slots.some(s=>occ.has(s.d+":"+s.h));
}
function compClash(c,p){
  const occ=occupancy(activeKeys().filter(k=>k!==c.key));
  const busy=new Set(occ.keys());
  const mine=[...(selected.includes(c.key)?c.slots:[]),...pickedComps(c).filter(x=>x.key!==p.key).flatMap(x=>x.slots)];
  mine.forEach(s=>busy.add(s.d+":"+s.h));
  return p.slots.some(s=>busy.has(s.d+":"+s.h));
}
const when=sl=>sl.map(s=>DAY_SHORT[s.d]+" "+s.h).join(" ")||"—";
const whenLong=sl=>sl.map(s=>DAY_SHORT[s.d]+" "+pStart(s.h)).join(", ")||"saat yok";

/* ---------- kalıcılık ---------- */
const save=()=>{ try{ localStorage.setItem("boun:plan",JSON.stringify({selected,picks,colorIds})); }catch(e){} };
function restore(){
  try{
    const s=JSON.parse(localStorage.getItem("boun:plan")||"null");
    if(s){ selected=(s.selected||[]).filter(byKey); picks=s.picks||{}; colorIds=s.colorIds||{}; }
  }catch(e){}
  Object.keys(picks).forEach(k=>{ if(!byKey(k)) delete picks[k]; });
  syncColors();
}

/* ---------- render ---------- */
const render=()=>{ renderList(); renderPlan(); };

function renderList(){
  const list=document.getElementById("list"), keep=list.scrollTop;
  const depts=[...new Set(catalog.map(c=>c.dept))];
  const chips=document.getElementById("chips");
  chips.innerHTML=""; chips.style.display=depts.length>1?"flex":"none";
  depts.forEach(d=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=d;
    b.setAttribute("aria-pressed",filterDept===d?"true":"false");
    b.onclick=()=>{filterDept=(filterDept===d?null:d);render();};
    chips.appendChild(b);
  });

  const q=query.trim().toLowerCase();
  const rows=catalog.filter(c=>{
    if(filterDept&&c.dept!==filterDept) return false;
    if(!q) return true;
    return (c.key+" "+c.name+" "+c.instr).toLowerCase().includes(q);
  });
  if(!rows.length){ list.innerHTML=`<div class="msg">Eşleşme yok.</div>`; return; }

  const frag=document.createDocumentFragment();
  rows.forEach(c=>{
    const on=selected.includes(c.key);
    const clash=!on&&clashesWith(c.slots,c.key);
    const row=document.createElement("div"); row.className="row"+(clash?" clashrow":"");
    const info=document.createElement("div"); info.className="info";
    const comps=typesOf(c).map(t=>compsOf(c,t).length+" "+t).join(" · ");
    info.innerHTML=`<div class="l1"><span class="code">${esc(c.key)}</span>
        <span class="when">${c.cr} kr</span>
        ${comps?`<button class="pill" data-x="1">${esc(comps)} ${expanded.has(c.key)?"▴":"▾"}</button>`:""}</div>
      <div class="l2" title="${esc(when(c.slots)+" · "+c.name+(c.instr?" · "+c.instr:""))}">${esc(when(c.slots))} · ${esc(c.name)}${c.instr?" · "+esc(c.instr):""}</div>`;
    const b=document.createElement("button");
    b.className="add"; b.dataset.on=on?"1":"0"; b.textContent=on?"−":"+";
    b.title=on?"Dersi kaldır":"Dersi ekle";
    b.onclick=()=>toggleCourse(c.key);
    const pill=info.querySelector("[data-x]");
    if(pill) pill.onclick=()=>{ expanded.has(c.key)?expanded.delete(c.key):expanded.add(c.key); render(); };
    row.append(info,b); frag.appendChild(row);

    if(expanded.has(c.key)) c.comps.forEach(p=>{
      const pon=(picks[c.key]||[]).includes(p.key);
      const pc=!pon&&compClash(c,p);
      const sub=document.createElement("div"); sub.className="row sub"+(pc?" clashrow":"");
      sub.innerHTML=`<div class="info"><div class="l1">
          <span class="ctype">${esc(p.type)}${compsOf(c,p.type).length>1?" "+p.no:""}</span>
          <span class="when">${esc(when(p.slots))}</span></div>
        <div class="l2" title="${esc((p.slots[0]&&p.slots[0].room||"")+(p.instr?" · "+p.instr:""))}">${esc(p.slots[0]&&p.slots[0].room||"")}${p.instr?" · "+esc(p.instr):""}</div></div>`;
      const pb=document.createElement("button");
      pb.className="add"; pb.dataset.on=pon?"1":"0"; pb.textContent=pon?"−":"+";
      pb.onclick=()=>pickComp(c.key,p.key);
      sub.appendChild(pb); frag.appendChild(sub);
    });
  });
  list.innerHTML=""; list.appendChild(frag); list.scrollTop=keep;
}

function renderPlan(){
  const active=activeKeys().map(byKey);
  const lec=selected.map(byKey).filter(Boolean);
  document.getElementById("sCr").textContent=Math.round(lec.reduce((a,c)=>a+(c.cr||0),0)*10)/10;
  document.getElementById("sEc").textContent=Math.round(lec.reduce((a,c)=>a+(c.ects||0),0)*10)/10;
  document.getElementById("sN").textContent=lec.length;

  const occ=occupancy(activeKeys());
  const clashes=[...occ.entries()].filter(([,v])=>v.length>1);
  document.getElementById("sCl").textContent=clashes.length;
  document.getElementById("sClashWrap").className="stat"+(clashes.length?" hot":"");

  const hrs=[...occ.keys()].map(id=>+id.split(":")[1]);
  const lo=Math.min(1,...hrs), hi=Math.max(9,...hrs);
  const sat=[...occ.keys()].some(id=>id.startsWith("5:")), nd=sat?6:5;

  let h=`<table class="grid"><thead><tr><th class="h"></th>`;
  for(let d=0;d<nd;d++) h+=`<th>${DAY_SHORT[d]}</th>`;
  h+="</tr></thead><tbody>";
  for(let p=Math.max(1,lo);p<=hi;p++){
    h+=`<tr><td class="h">${pStart(p)}</td>`;
    for(let d=0;d<nd;d++){
      const it=occ.get(d+":"+p)||[];
      const draw=x=>{ const col=colorOf(x.unit.courseKey);
        return `<div class="blk${x.unit.comp?" comp":""}" style="background:${col.bg};color:${col.fg}">
          <span class="c">${esc(x.unit.label)}${x.unit.tag?" "+esc(x.unit.tag):""}</span>
          <span class="r">${esc(x.room||"")}</span></div>`; };
      h+='<td class="s">'+(it.length===1?draw(it[0]):it.length>1?'<div class="clash">'+it.map(draw).join("")+"</div>":"")+"</td>";
    }
    h+="</tr>";
  }
  document.getElementById("grid").innerHTML=h+"</tbody></table>";

  let notes="";
  if(clashes.length){
    notes+=`<div class="note"><b>Çakışma:</b><ul>`+clashes.map(([id,v])=>{
      const [d,p]=id.split(":").map(Number);
      return `<li>${DAY_TR[d]} ${pStart(p)}–${pEnd(p)} — ${v.map(x=>esc(x.unit.label+(x.unit.tag?" "+x.unit.tag:""))).join(" / ")}</li>`;
    }).join("")+"</ul></div>";
  }
  const miss=[];
  lec.forEach(c=>typesOf(c).forEach(t=>{ if(!pickedComps(c).some(p=>p.type===t)) miss.push(c.key+" → "+t); }));
  if(miss.length) notes+=`<div class="note soft">Eklenmemiş: ${esc(miss.join(", "))}</div>`;
  document.getElementById("notes").innerHTML=notes;

  const sel=document.getElementById("sel");
  if(!active.length){ sel.innerHTML=`<div class="msg">Soldaki listeden <b>+</b> ile ders, lab ya da problem saati ekle.</div>`; return; }
  sel.innerHTML="";
  active.forEach(c=>{
    const col=colorOf(c.key), hasLec=selected.includes(c.key);
    const row=document.createElement("div"); row.className="row";
    const sw=document.createElement("span"); sw.className="swatch"; sw.style.background=col.bg;
    const info=document.createElement("div"); info.className="info";
    info.innerHTML=`<div class="l1"><span class="code">${esc(c.key)}</span>
        <span class="when">${hasLec?c.cr+" kr / "+c.ects+" ects · "+esc(whenLong(c.slots)):"yalnız lab/P.S."}</span></div>
      <div class="l2">${esc(c.name)}</div>`;
    if(c.comps.length){
      const g=document.createElement("div"); g.className="opts";
      c.comps.forEach(p=>{
        const on=(picks[c.key]||[]).includes(p.key);
        const b=document.createElement("button");
        b.className="opt"; b.dataset.on=on?"1":"0"; b.dataset.clash=(!on&&compClash(c,p))?"1":"0";
        b.textContent=p.type+(compsOf(c,p.type).length>1?" "+p.no:"")+" · "+when(p.slots);
        b.title=whenLong(p.slots)+(p.instr?" · "+p.instr:"");
        b.onclick=()=>pickComp(c.key,p.key);
        g.appendChild(b);
      });
      info.appendChild(g);
    }
    const x=document.createElement("button"); x.className="x"; x.textContent="×"; x.title="Kaldır";
    x.onclick=()=>{ const i=selected.indexOf(c.key); if(i>=0) selected.splice(i,1); delete picks[c.key]; syncColors(); save(); render(); };
    row.append(sw,info,x); sel.appendChild(row);
  });
}

/* ---------- eylemler ---------- */
function toggleCourse(k){
  const i=selected.indexOf(k);
  if(i<0) selected.push(k); else selected.splice(i,1);
  syncColors(); save(); render();
}
function pickComp(ck,pk){
  const cur=picks[ck]||[];
  const next=cur.includes(pk)?cur.filter(x=>x!==pk):[...cur,pk];
  if(next.length) picks[ck]=next; else delete picks[ck];
  syncColors(); save(); render();
}
document.getElementById("q").oninput=e=>{query=e.target.value;renderList();};
document.getElementById("btnClear").onclick=()=>{selected=[];picks={};colorIds={};save();render();};

/* ---------- tema ---------- */
function setTheme(t){
  document.documentElement.dataset.theme=t;
  try{ localStorage.setItem("boun:theme",t); }catch(e){}
  if(catalog.length) renderPlan();
}
document.getElementById("btnTheme").onclick=()=>
  setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
(function(){
  let t=null; try{ t=localStorage.getItem("boun:theme"); }catch(e){}
  if(!t) t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  setTheme(t);
})();

/* ---------- açılış: data/ klasöründen oku ---------- */
(async function(){
  const list=document.getElementById("list");
  let loaded=[];
  try{
    const man=await fetch(DATA_DIR+"index.json",{cache:"no-cache"}).then(r=>r.json());
    const files=Array.isArray(man)?man:(man.files||[]);
    if(man&&man.term) term=man.term;
    for(const f of files){
      try{
        const txt=await fetch(DATA_DIR+f,{cache:"no-cache"}).then(r=>r.text());
        loaded=loaded.concat(parseCatalog(txt));
      }catch(e){ console.warn("okunamadı:",f,e); }
    }
  }catch(e){ console.warn("data/index.json okunamadı:",e); }

  if(!loaded.length){ loaded=FALLBACK; if(!term) term="gömülü veri"; }
  const seen=new Map(); loaded.forEach(c=>{ if(!seen.has(c.key)) seen.set(c.key,c); });
  catalog=[...seen.values()];
  document.getElementById("term").textContent=term||"";
  if(!catalog.length){ list.innerHTML=`<div class="msg">Katalog boş. <code>data/index.json</code> ve içindeki dosyaları kontrol et.</div>`; return; }
  restore(); render();
})();
</script>
</html>
